# Kettlebell & TRX: Kernlogik testen (Linux) und iOS-/watchOS-App bauen (macOS).
name: Kettlebell & TRX

on:
  push:
    paths: ["KettlebellTRX/**", ".github/workflows/kettlebell-trx.yml"]
  pull_request:
    paths: ["KettlebellTRX/**", ".github/workflows/kettlebell-trx.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: FitnessCore-Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: KettlebellTRX
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Planvorschau
        run: swift run kbtrx-plan

  apps-build:
    name: iOS- und watchOS-App bauen (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: KettlebellTRX
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: FitnessCore-Tests (macOS)
        run: swift test
      - name: iOS-App inkl. Watch-App bauen (ohne Signatur)
        run: |
          xcodebuild -project KettlebellTRX.xcodeproj -scheme KettlebellTRX \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -n 200 build.log; exit 1; }
          grep -E "\*\* BUILD" build.log
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|bundle-identifier" build.log | grep -o "bundle-identifier [^ ]*" | sort -u || true
          echo "--- Warnungen im App-Code ---"
          grep -E "/Apps/.*: (warning|error):" build.log | sort -u || echo "keine"

  demo-screenshots:
    name: Demo-Screenshots (iPhone-Simulator)
    runs-on: macos-15
    needs: apps-build
    defaults:
      run:
        working-directory: KettlebellTRX
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Simulator wählen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 16')]; print(c[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
      - name: App mit Beispieldaten durchklicken
        run: |
          mkdir -p screenshots
          xcodebuild test -project KettlebellTRX.xcodeproj -scheme KettlebellTRX \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:KettlebellTRXUITests \
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" > uitest.log 2>&1 || { tail -n 120 uitest.log; echo "UI-Test fehlgeschlagen"; }
          grep -E "Test Case|error:|failed" uitest.log | tail -n 40 || true
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: KettlebellTRX/screenshots
          if-no-files-found: warn
