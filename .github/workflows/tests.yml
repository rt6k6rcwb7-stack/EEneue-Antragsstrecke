# Führt die Tests bei jedem Pull Request aus – so fällt ein Fehler
# (z. B. nach einer Parameteränderung in CONFIG) schon vor dem Merge auf.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript-Syntax prüfen
        run: for f in assets/*.js tests/*.js; do node --check "$f" || exit 1; done

      - name: Rechenkern testen
        run: node tests/calc.test.js
