# Veröffentlicht die statische Seite auf GitHub Pages.
# Voraussetzung (einmalig): Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rechenkern prüfen (Testfall Wind)
        run: |
          node -e '
            const EE = require("./assets/calc.js");
            const r = EE.berechne({ technologie: "wind", leistungMW: 24, p50h: 2400, p90h: 2050,
              preisEURMWh: 73, capexTEUR: 34800, opexTEUR: 1100, fkQuoteProzent: 80,
              zinsProzent: 4.2, laufzeitJahre: 18 });
            const ok = Math.abs(r.dscrP50 - 1.39) < 0.005 && Math.abs(r.dscrP90 - 1.11) < 0.01
              && Math.abs(r.annuitaet - 2235) < 1;
            console.log("DSCR P50", r.dscrP50.toFixed(3), "DSCR P90", r.dscrP90.toFixed(3), "Annuität", r.annuitaet.toFixed(1));
            if (!ok) { console.error("Testfall weicht ab"); process.exit(1); }
          '

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html anfrage.html portal.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
