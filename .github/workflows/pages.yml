# Veröffentlicht die statische Seite auf GitHub Pages.
# Voraussetzung (einmalig): Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rechenkern prüfen
        run: node tests/calc.test.js

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html anfrage.html portal.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
